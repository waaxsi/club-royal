<!doctype html>
<html lang="fr" data-motion="cinematic">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c17">
  <meta name="description" content="CLUB ROYAL — Poker entre amis, blackjack, roulette et mini-jeux. Euros entièrement fictifs, aucune valeur monétaire.">
  <title>CLUB ROYAL · Le jeu, entre nous.</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"><i></i><i></i></div>
  <aside class="rail" aria-label="Navigation principale">
    <button class="brand-monogram" data-nav="home" aria-label="CLUB ROYAL, accueil">R<span>◆</span></button>
    <div class="rail-nav">
      <button data-nav="home" class="rail-btn active" title="Le salon" aria-label="Le salon"><span>⌂</span><small>Salon</small></button>
      <button data-game="poker" class="rail-btn" title="Poker" aria-label="Poker"><span>♠</span><small>Poker</small></button>
      <button data-game="blackjack" class="rail-btn" title="Blackjack" aria-label="Blackjack"><span class="twenty-one">21</span><small>Blackjack</small></button>
      <button data-game="roulette" class="rail-btn" title="Roulette" aria-label="Roulette"><span>◉</span><small>Roulette</small></button>
      <button data-nav="arcade" class="rail-btn" title="Mini-jeux" aria-label="Mini-jeux"><span>◇</span><small>Arcade</small></button>
      <div class="rail-divider"></div>
      <button data-nav="wallet" class="rail-btn" title="Mon portefeuille" aria-label="Mon portefeuille"><span>€</span><small>Solde</small></button>
      <button data-nav="admin" id="admin-nav" class="rail-btn" title="Administration" aria-label="Administration" hidden><span>⌘</span><small>Admin</small></button>
    </div>
    <button class="rail-btn rail-help" data-do="help" title="Les règles" aria-label="Aide"><span>?</span><small>Aide</small></button>
  </aside>
  <div class="shell">
    <header class="topbar">
      <div class="wordmark" data-nav="home" role="button" tabindex="0">CLUB<span>ROYAL<span class="brand-star">✦</span></span></div>
      <div class="top-context"><span class="live-dot"></span><span id="connection-label">Connexion…</span></div>
      <div class="top-actions">
        <button id="sound-toggle" class="icon-btn" data-do="sound" title="Activer les sons" aria-label="Activer les sons">♪</button>
        <button id="wallet-button" class="wallet-pill" data-nav="wallet" hidden><span class="wallet-symbol">€</span><span><small>SOLDE FICTIF</small><strong id="header-balance">0,00 €</strong></span><span class="wallet-arrow">↗</span></button>
        <button id="account-button" class="button button-soft" data-nav="account">Se connecter <span>↗</span></button>
      </div>
    </header>
    <div id="site-banner" class="site-banner" hidden role="status"></div>
    <div id="resume-bar" class="resume-bar" hidden><span>Une place t’attend à ta table.</span><button class="text-button" data-nav="table">Reprendre la partie →</button></div>
    <main id="app" tabindex="-1"><div class="loading-scene"><span class="loader"></span><p>On prépare le salon…</p></div></main>
    <footer class="site-footer"><span>CLUB ROYAL <b>✦</b> Le jeu, entre nous.</span><span>100 % fictif · Aucune valeur monétaire · Aucun dépôt ni retrait</span><button class="text-button" data-do="settings">Préférences</button></footer>
  </div>
  <dialog id="dialog"><button id="close-dialog" class="dialog-close icon-btn" data-do="close" aria-label="Fermer">×</button><div id="dialog-content"></div></dialog>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <div id="result-layer" class="result-layer" hidden role="status" aria-live="polite"></div>
  <noscript><p class="no-js">Active JavaScript pour jouer. Lance le serveur Node.js, puis ouvre son adresse, pas ce fichier directement.</p></noscript>
</body>
</html>
